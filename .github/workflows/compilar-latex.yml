name: Compile FRACSMART LaTeX

on:
  push:
    paths:
      - "FRACSMART/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: FRACSMART

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: FRACSMART-PDF
          path: FRACSMART/main.pdf
